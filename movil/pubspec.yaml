name: ceos_app
description: "CEOS — App móvil de gestión para clínica dental (Usuarios, Inventario, Backup)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Manejo de estado ---
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # --- Navegación ---
  go_router: ^14.6.2

  # --- Cliente HTTP / API ---
  dio: ^5.7.0

  # --- Almacenamiento seguro (tokens JWT) ---
  flutter_secure_storage: ^9.2.2

  # --- Tipografía (Space Grotesk, Inter, IBM Plex Mono) ---
  google_fonts: ^6.2.1

  # --- Íconos (catálogo curado de Áreas/Categorías) ---
  phosphor_flutter: ^2.1.0

  # --- Biométrico local (huella/Face ID para reingreso rápido) ---
  local_auth: ^2.3.0

  # --- Formularios y utilidades de fecha ---
  intl: ^0.19.0

  # --- Apertura de archivos descargados (reportes PDF) ---
  open_filex: ^4.5.0

  # --- Descarga de archivos (reportes PDF, backups) ---
  path_provider: ^2.1.5

  # --- Apertura de enlaces externos (Telegram deep link, etc.) ---
  url_launcher: ^6.3.1

  # --- Serialización de modelos ---
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  cupertino_icons: ^1.0.8
  material_symbols_icons: ^4.2960.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # --- Generación de código (modelos inmutables + JSON) ---
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.2

  # --- Testing de widgets/integración ---
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
