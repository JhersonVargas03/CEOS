name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*' # Se ejecuta al crear un tag como v1.0.1, v1.0.2, etc.
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre de la versión (ej. v1.0.1)'
        required: true
        default: 'v1.0.1'
      release_notes:
        description: 'Novedades de la versión'
        required: false
        default: 'Mejoras de rendimiento, estabilidad del sistema y corrección de errores.'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release CEOS.apk
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd movil
          flutter pub get

      - name: Run Flutter Tests
        continue-on-error: true
        run: |
          cd movil
          flutter test --reporter expanded

      - name: Setup Release Keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/ceos-release.jks 2>/dev/null || true
          fi
          if [ ! -s "${{ github.workspace }}/ceos-release.jks" ]; then
            echo "Secret vacio o no disponible, usando keystore del repositorio..."
            cp movil/android/app/ceos-release.jks ${{ github.workspace }}/ceos-release.jks
          fi
          ls -lh ${{ github.workspace }}/ceos-release.jks

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/ceos-release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD || 'ceosclinico2024' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'ceos' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'ceosclinico2024' }}
        run: |
          cd movil
          chmod +x android/gradlew
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          flutter build apk --release --split-per-abi

      - name: Prepare Binary Assets
        run: |
          cd movil/build/app/outputs/flutter-apk
          # El APK arm64-v8a (teléfonos modernos) es el estándar ligero (~18 MB vs 61 MB)
          cp app-arm64-v8a-release.apk ${{ github.workspace }}/CEOS.apk
          cp app-arm64-v8a-release.apk ${{ github.workspace }}/CEOS-arm64.apk
          if [ -f "app-armeabi-v7a-release.apk" ]; then
            cp app-armeabi-v7a-release.apk ${{ github.workspace }}/CEOS-arm32.apk
          fi
          cd ${{ github.workspace }}
          ls -lh CEOS*.apk

      - name: Determine Tag & Release Notes
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "notes=${{ github.event.inputs.release_notes }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "notes=Actualización optimizada de CEOS Clínico (${GITHUB_REF#refs/tags/})." >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: CEOS ${{ steps.release_info.outputs.tag }}
          body: |
            ### 📱 CEOS Clínico — Actualización

            ${{ steps.release_info.outputs.notes }}

            ---
            #### 📥 Descarga Directa:
            - **[Descargar CEOS.apk (Recomendado, ~18 MB)](https://github.com/JhersonVargas03/CEOS/releases/download/${{ steps.release_info.outputs.tag }}/CEOS.apk)**
            - [Descargar para teléfonos antiguos (32-bit ARM)](https://github.com/JhersonVargas03/CEOS/releases/download/${{ steps.release_info.outputs.tag }}/CEOS-arm32.apk)
          files: |
            ./CEOS.apk
            ./CEOS-arm64.apk
            ./CEOS-arm32.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

