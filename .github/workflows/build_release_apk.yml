name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*' # Se ejecuta al crear un tag como v1.0.1, v1.0.2, etc.
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre de la versión (ej. v1.0.1)'
        required: true
        default: 'v1.0.1'
      release_notes:
        description: 'Novedades de la versión'
        required: false
        default: 'Mejoras de rendimiento, estabilidad del sistema y corrección de errores.'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release CEOS.apk
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd movil
          flutter pub get

      - name: Run Flutter Tests
        continue-on-error: true
        run: |
          cd movil
          flutter test --reporter expanded

      - name: Decode Keystore from Secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/ceos-release.jks
          echo "Keystore size: $(ls -lh ${{ github.workspace }}/ceos-release.jks)"

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/ceos-release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd movil
          chmod +x android/gradlew
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          flutter build apk --release --verbose

      - name: Prepare Binary Asset
        run: |
          cp movil/build/app/outputs/flutter-apk/app-release.apk ./CEOS.apk
          ls -lh ./CEOS.apk

      - name: Determine Tag & Release Notes
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "notes=${{ github.event.inputs.release_notes }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "notes=Actualización automática de CEOS Clínico (${GITHUB_REF#refs/tags/})." >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: CEOS ${{ steps.release_info.outputs.tag }}
          body: |
            ### 📱 CEOS Clínico — Actualización

            ${{ steps.release_info.outputs.notes }}

            ---
            #### 📥 Descarga Directa:
            - [Descargar CEOS.apk](https://github.com/JhersonVargas03/CEOS/releases/download/${{ steps.release_info.outputs.tag }}/CEOS.apk)
          files: |
            ./CEOS.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

